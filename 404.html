    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {

      }
      h1, h2, h3, h4, h5, h6, .heading-font {
        font-family: 'Syncopate', sans-serif;

    <meta property="og:type" content="website" />

    <link rel="stylesheet" crossorigin href="/Beemo-Studio/assets/index-CMe0zuTI.css">
  </head>
  <body>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.background = 'red';
        errDiv.style.color = 'white';
        errDiv.style.padding = '20px';
        errDiv.style.zIndex = '999999';
        errDiv.innerHTML = '<h1>Error</h1><p>' + message + '</p><pre>' + (error ? error.stack : '') + '</pre>';
        document.body.appendChild(errDiv);
      };
      window.addEventListener("unhandledrejection", function(event) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '50%';
        errDiv.style.left = '0';
        errDiv.style.background = 'orange';
        errDiv.style.color = 'white';
        errDiv.style.padding = '20px';
        errDiv.style.zIndex = '999999';
        errDiv.innerHTML = '<h1>Promise Error</h1><p>' + event.reason + '</p>';
        document.body.appendChild(errDiv);
      });
    </script>
    <div id="root"></div>
  </body>
</html>
